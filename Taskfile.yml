# DST enforcing test configurations — docs/dst/design.md "Enforcing test
# configurations" is the authoritative list; this file encodes it verbatim.
#
# Two operational rules these tasks exist to enforce:
#   1. Honest exit codes: no pipelines around `go test` (a `| tail -1` reports
#      the pipe's status, not the test's — this masked real failures twice).
#      Each command's failure fails its task; the aggregate is sequential and
#      fail-fast.
#   2. After ANY cmd/compile change, run `task compiler` (or at minimum
#      `bin/go clean -cache`): this fork reports a release version string, so
#      tool IDs come from the version, not the binary hash, and a reinstalled
#      compiler does NOT invalidate cached objects.
#
# Every command runs as `GOROOT={{.ROOT_DIR}} TMPDIR={{.ROOT_DIR}}/.tmp ...`
# (via the RUN var): an exported GOROOT in the developer's environment would
# otherwise redirect every leg to another toolchain's runtime — green exit
# codes, vacuous run — and TMPDIR pins the heavy build/test temp trees to the
# gitignored on-disk .tmp/ at the repo root, because the std leg's parallel
# build trees plus accumulated per-test temp dirs can fill a tmpfs /tmp
# mid-leg ("disk quota exceeded" / "no space left on device" masquerading as
# build regressions). .tmp/ is freely deletable between runs. The shell-level
# assignments are deliberate: Taskfile `env:` loses to the OS environment by
# default, a shell prefix never does. (The prefix assumes a space-free repo
# path; quote RUN's expansion if that ever changes.)
version: '3'

# test:conformance runs a BOUNDED differential sweep by default (4 seeds per
# domain); set DST_CONFORMANCE_SEEDS=<n> in the environment for a wider sweep
# (the harness reads it before any simulation starts; see
# src/testing/simulation/conformance/doc.go).

vars:
  RUN: 'GOROOT={{.ROOT_DIR}} TMPDIR={{.ROOT_DIR}}/.tmp {{.ROOT_DIR}}/bin/go'

tasks:
  tmpdir:
    internal: true
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tmp
  test:
    desc: The fast enforcing legs (untagged, dst, dst-race, conformance), sequential and fail-fast; test:inert-std runs separately
    cmds:
      - task: test:untagged
      - task: test:dst
      - task: test:dst-race
      - task: test:conformance

  test:untagged:
    desc: Untagged -short runtime — DST hooks inert; testprog stays cgo-free (deadlock crash tests live)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -count=1 -short runtime'

  test:dst:
    desc: -tags dst, non-short — explore sweep, race oracle, auto-instrumentation, build-mode inertness, net shims
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 60m runtime testing/simulation crypto/rand net os syscall os/exec os/signal'

  test:dst-race:
    desc: -tags dst -race testing/simulation — suite is race-clean; any TSan report here is a real finding
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -race -count=1 testing/simulation'

  test:conformance:
    desc: Host-vs-sim differential conformance harness (pipes/TCP/fs) — bounded seed sweep; DST_CONFORMANCE_SEEDS widens
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 30m testing/simulation/conformance'

  test:inert-std:
    desc: Untagged -short std — build-mode inertness across all of std (heavy; not in `task test`)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -count=1 -short std'

  test:cross:
    desc: Untagged standard-library cross-builds for Windows and Plan 9 file layouts
    dir: src
    deps: [tmpdir]
    cmds:
      - 'GOOS=windows GOARCH=amd64 CGO_ENABLED=0 {{.RUN}} build std'
      - 'GOOS=plan9 GOARCH=amd64 CGO_ENABLED=0 {{.RUN}} build std'

  compiler:
    desc: Reinstall cmd/compile, then clean the build cache (release version string ⇒ stale tool IDs otherwise)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} install cmd/compile'
      - '{{.RUN}} clean -cache'

  # Porting: docs/dst/releases.md is the contract (branches, tags, VERSION
  # scheme); this task is the executable rebase step. CUR names the base the
  # stack currently sits on, NEW the base to move to — passing both explicitly
  # keeps the replayed range exactly the dst stack, never upstream's own
  # backports. rerere is enabled repo-locally, so conflict resolutions replay.
  # After a port: resolve VERSION to the new base + -dst.1, run `task compiler`
  # (upstream may have touched cmd/compile), then the full test matrix, then tag.
  port:
    desc: 'Rebase the dst stack onto a new upstream base: task port CUR=upstream/release-branch.go1.26 NEW=upstream/release-branch.go1.27'
    preconditions:
      - sh: test -n "{{.CUR}}" && test -n "{{.NEW}}"
        msg: 'usage: task port CUR=<current-base-ref> NEW=<new-base-ref>'
    cmds:
      - git fetch upstream
      - git rebase --onto {{.NEW}} $(git merge-base HEAD {{.CUR}})
