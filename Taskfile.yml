# DST enforcing test configurations — docs/dst/design.md "Enforcing test
# configurations" is the authoritative list; this file encodes it verbatim.
#
# Two operational rules these tasks exist to enforce:
#   1. Honest exit codes: no pipelines around `go test` (a `| tail -1` reports
#      the pipe's status, not the test's — this masked real failures twice).
#      Each command's failure fails its task; the aggregate is sequential and
#      fail-fast.
#   2. After ANY cmd/compile change, run `task compiler` (or at minimum
#      `bin/go clean -cache`): this fork reports a release version string, so
#      tool IDs come from the version, not the binary hash, and a reinstalled
#      compiler does NOT invalidate cached objects.
#
# Every command runs as `GOROOT={{.ROOT_DIR}} ...`: an exported GOROOT in
# the developer's environment would otherwise redirect every leg to another
# toolchain's runtime — green exit codes, vacuous run. Every command except
# the cmd legs also pins `TMPDIR={{.ROOT_DIR}}/.tmp` (via the RUN var) to
# keep the heavy build/test temp trees on the gitignored on-disk .tmp/ at
# the repo root, because the std leg's parallel build trees plus accumulated
# per-test temp dirs can fill a tmpfs /tmp mid-leg ("disk quota exceeded" /
# "no space left on device" masquerading as build regressions). .tmp/ is
# freely deletable between runs. The cmd and dist legs are the exception:
# cmd/go refuses a work dir inside GOROOT, so they mktemp outside the repo
# (see exttmp-go). The shell-level assignments are deliberate: Taskfile
# `env:` loses to the OS environment by default, a shell prefix never does.
# (The prefix assumes a space-free repo path; quote RUN's expansion if that
# ever changes.)
version: '3'

# test:conformance runs a BOUNDED differential sweep by default (4 seeds per
# domain); set DST_CONFORMANCE_SEEDS=<n> in the environment for a wider sweep
# (the harness reads it before any simulation starts; see
# src/testing/simulation/conformance/doc.go).

vars:
  # GOTOOLCHAIN=local: without it a toolchain directive in the ambient
  # environment (~/.config/go/env) or a go.mod would silently re-route
  # bin/go to ANOTHER toolchain — green exit codes, vacuous run, the same
  # class the GOROOT pin closes.
  RUN: 'GOROOT={{.ROOT_DIR}} GOTOOLCHAIN=local TMPDIR={{.ROOT_DIR}}/.tmp {{.ROOT_DIR}}/bin/go'

tasks:
  tmpdir:
    internal: true
    cmds:
      - mkdir -p {{.ROOT_DIR}}/.tmp
  test:
    desc: The fast enforcing legs (untagged, api, dst, dst-race, determinism, conformance), sequential and fail-fast; test:inert-std runs separately
    cmds:
      - task: test:untagged
      - task: test:api
      - task: test:dst
      - task: test:dst-race
      - task: test:determinism
      - task: test:conformance

  test:untagged:
    desc: Untagged -short runtime — DST hooks inert; testprog stays cgo-free (deadlock crash tests live); vet net compile-gates the untagged net test build; go/build pins the std dependency policy the dst imports must respect
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -count=1 -short runtime'
      # go/build's TestDependencies is the std import-policy gate (which
      # package may import which); dst adds imports to std packages, and a
      # violation surfaces nowhere else before the heavy inert-std leg.
      - '{{.RUN}} test -count=1 -short go/build'
      # Untagged `go test net` must COMPILE: dst test files are either
      # build-tagged (white-box, dst-only symbols) or stub-compilable via
      # dst_off.go. vet type-checks the test files without running them, so
      # a dst-only symbol leaking into an untagged test file fails here
      # instead of surfacing only when a developer runs `go test net` by hand.
      - '{{.RUN}} vet net'

  test:dst:
    desc: -tags dst, non-short — explore sweep, race oracle, auto-instrumentation, build-mode inertness, net shims
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 60m runtime testing/simulation crypto/rand net os syscall os/exec os/signal'

  test:dst-race:
    desc: -tags dst -race testing/simulation + determinism sweep — suite is race-clean; any TSan report here is a real finding
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -race -count=1 -timeout 60m testing/simulation testing/simulation/determinism'

  test:determinism:
    desc: Same-seed determinism sweep — cross-run, cross-process, and environmental-perturbation transcript equality
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 20m testing/simulation/determinism'

  test:conformance:
    desc: Host-vs-sim differential conformance harness (pipes/TCP/fs) — bounded seed sweep; DST_CONFORMANCE_SEEDS widens
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 30m testing/simulation/conformance'

  # The cmd and dist legs use a TMPDIR OUTSIDE the repo: cmd/go's script
  # tests refuse to run when their work dir sits inside GOROOT ("testgo must
  # not write to GOROOT"), so the usual {{.ROOT_DIR}}/.tmp pin cannot apply.
  # mktemp keeps the heavy trees off tmpfs risk per-run and the EXIT trap
  # removes them on success and on failure — but not on SIGKILL or a
  # cancelled CI job, which leave the tree under the system temp dir
  # (acceptable: CI runners are ephemeral, and a developer machine's temp
  # dir is OS-cleaned).
  # ARGS is spliced into the command as shell source (everything after
  # `bin/go`), not passed as argv: keep it to metacharacter-free words (no
  # spaces-in-words, quotes, globs).
  exttmp-go:
    internal: true
    dir: src
    cmds:
      - |
        set -e
        t=$(mktemp -d)
        trap 'rm -rf "$t"' EXIT
        GOROOT={{.ROOT_DIR}} GOTOOLCHAIN=local TMPDIR="$t" {{.ROOT_DIR}}/bin/go {{.ARGS}}

  test:testdir:
    desc: The top-level test/ suite (codegen, fixedbugs, errorcheck) via cmd/internal/testdir — pins cmd/compile and cmd/link behavior
    cmds:
      - task: exttmp-go
        vars: { ARGS: 'test -count=1 -timeout 40m cmd/internal/testdir' }

  test:cmd:
    desc: cmd suites over the fork's toolchain changes — cmd/go short (its slow/network half skips), cmd/compile and cmd/link in full
    cmds:
      - task: exttmp-go
        vars: { ARGS: 'test -count=1 -short -timeout 60m cmd/go' }
      # cmd/compile and cmd/link run WITHOUT -short: short mode drops the
      # compiler tests this fork is most exposed to — TestIntendedInlining
      # above all, which pins the std inlinability surface the INV-VANILLA
      # admissions lean on.
      - task: exttmp-go
        vars: { ARGS: 'test -count=1 -timeout 60m cmd/compile/... cmd/link/...' }

  test:dist:
    desc: Upstream's release-validation harness (`go tool dist test`), untagged — the full dist registration incl. the cgo suites and API check; std tests run in dist's default short mode (upstream's default-builder bound; the longtest axis is not claimed)
    cmds:
      # -k keeps going past a failure so a nightly red reports every red
      # test, not just the first; the exit code is still non-zero.
      - task: exttmp-go
        vars: { ARGS: 'tool dist test -k' }

  test:api:
    desc: Exported std API check — upstream's api/go1.N.txt corpus plus godst's own api/go1-godst.txt (testing/simulation)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -count=1 cmd/api -check'

  test:inert-diff:
    desc: INV-VANILLA differential gate — untagged probe-corpus text vs the upstream base toolchain (design.md, "Untagged footprint")
    dir: src
    deps: [tmpdir]
    cmds:
      - |
        set -e
        if [ -z "$DST_STOCK_GOROOT" ]; then
          base=$(head -1 {{.ROOT_DIR}}/VERSION | sed 's/-dst\..*//')
          command -v go >/dev/null 2>&1 || { echo "DST_STOCK_GOROOT is unset and no host go is available to provide $base"; exit 1; }
          got=$(GOTOOLCHAIN=$base go version | awk '{print $3}')
          [ "$got" = "$base" ] || { echo "host go provided $got, want $base"; exit 1; }
          DST_STOCK_GOROOT=$(GOTOOLCHAIN=$base go env GOROOT)
          export DST_STOCK_GOROOT
        fi
        DST_STOCK_GOROOT="$DST_STOCK_GOROOT" {{.RUN}} test -tags dst -count=1 -timeout 20m -v -run 'TestUntaggedTextIdenticalToStock' testing/simulation

  test:inert-std:
    desc: Untagged -short std — build-mode inertness across all of std (heavy; not in `task test`)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -count=1 -short std'

  test:cross:
    desc: Untagged `build std` across the supported platform list — Unix arches, darwin, the BSDs, js/wasip1, Windows, Plan 9 — plus the dst architecture-scope refusal probes
    dir: src
    deps: [tmpdir]
    cmds:
      - 'GOOS=windows GOARCH=amd64 CGO_ENABLED=0 {{.RUN}} build std'
      - 'GOOS=plan9 GOARCH=amd64 CGO_ENABLED=0 {{.RUN}} build std'
      # Untagged builds must remain valid upstream ports on every platform
      # the design claims: the fenced Unix architectures (design.md, "The
      # interception boundary" → Architecture scope), both darwin arches,
      # the BSDs, and the js/wasm + wasip1 file layouts the tagged
      # filesystem section names.
      - |
        set -e
        for p in linux/386 linux/arm linux/arm64 linux/riscv64 linux/ppc64 linux/ppc64le linux/s390x \
                 darwin/amd64 darwin/arm64 freebsd/amd64 openbsd/amd64 js/wasm wasip1/wasm; do
          GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 {{.RUN}} build std
        done
      # Architecture-scope refusal: DST claims no support on loong64/MIPS
      # (design.md, "The interception boundary" → Architecture scope), so a
      # dst-tagged build there must fail AND fail with the intended sentinel
      # message from runtime/dst_arch_unsupported.go — an accidental
      # missing-symbol failure would pass a bare negation but not this probe.
      # Pipeline-free by design: the case-match is the assertion.
      - |
        for a in loong64 mips mipsle mips64 mips64le; do
          if out=$(GOOS=linux GOARCH=$a CGO_ENABLED=0 {{.RUN}} build -tags dst runtime 2>&1); then
            echo "dst-tagged build unexpectedly succeeded on linux/$a"; exit 1
          fi
          case "$out" in
            *"unsupported on this architecture"*) ;;
            *) printf '%s\n' "$out"; echo "linux/$a dst refusal is missing the intended sentinel message"; exit 1;;
          esac
        done

  # Both build modes. make.bash and the untagged build never compile the
  # dst_* files, so an upstream signature change breaking only a tagged file
  # is invisible until the tagged build runs; every gate that builds, builds
  # both (releases.md "Porting procedure", "Continuous integration").
  build:both:
    desc: Untagged and -tags dst std builds
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} build std'
      - '{{.RUN}} build -tags dst std'

  # The release workflow's smoke of a freshly built toolchain — tagged,
  # -short (the sweeps skip), enough to prove the simulation starts and the
  # dst_* files compiled into the packaged toolchain. Not a gate leg.
  smoke:
    desc: Tagged -short testing/simulation against the built toolchain
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} test -tags dst -short -count=1 -timeout 20m testing/simulation'

  compiler:
    desc: Reinstall cmd/compile, then clean the build cache (release version string ⇒ stale tool IDs otherwise)
    dir: src
    deps: [tmpdir]
    cmds:
      - '{{.RUN}} install cmd/compile'
      - '{{.RUN}} clean -cache'

  # Porting: docs/dst/releases.md "Porting procedure" is the contract; `port`
  # is its executable step 1 and `port:check` its step 3. The port commit is
  # a merge commit whose TREE is the new base plus the dst delta, not git's
  # three-way merge (which would keep the old release branch's backports the
  # new base lacks): record the parent with `-s ours`, replace the tree with
  # the new base, re-apply the delta from the old base with a three-way
  # fallback. One shell block, deliberately: the old base is read off VERSION
  # BEFORE read-tree replaces it (a per-command shell would read the new
  # base's VERSION and re-apply a delta that reverts upstream) and is
  # recorded with the merge parent under .git/ for `port:check`. Guards: only
  # an upstream release TAG can be a base; an already-ported base leaves no
  # MERGE_HEAD and is refused (a port is never a single-parent commit).
  port:
    desc: 'Port the current line to an upstream release tag: task port BASE=go1.27.0'
    preconditions:
      - sh: test -n "{{.BASE}}"
        msg: 'usage: task port BASE=<upstream release tag, e.g. go1.27.0>'
    cmds:
      - |
        set -e
        git fetch upstream tag {{.BASE}}
        git rev-parse -q --verify 'refs/tags/{{.BASE}}^{commit}' >/dev/null || { echo '{{.BASE}} is not a tag'; exit 1; }
        old=$(head -1 VERSION | sed 's/-dst\..*//')
        # The path lists below are newline-delimited and word-split, and
        # pathspecs are fnmatch patterns: a dst-delta path carrying
        # whitespace, quotes (git quotes non-ASCII names), backslashes or
        # glob metacharacters would be mis-handled silently, so such a path
        # is refused loudly instead. The doubled backslash is deliberate: a
        # POSIX grep reads a backslash inside a bracket expression literally,
        # ugrep reads it as an escape — `\\` means "backslash" to both.
        if git diff --name-only "$old" HEAD | grep -q '[][:space:]"'"'"'\\*?[]'; then
          echo 'a dst-patched path contains whitespace, quotes (git quotes non-ASCII names), backslashes or glob characters; the port tooling does not quote — rename it first'; exit 1
        fi
        git merge -s ours --no-ff --no-commit {{.BASE}}
        new=$(git rev-parse -q --verify MERGE_HEAD) || { echo '{{.BASE}} is already an ancestor: nothing to port'; exit 1; }
        printf '%s %s\n' "$old" "$new" > "$(git rev-parse --git-dir)/DST_PORT"
        git read-tree -u --reset {{.BASE}}
        # A dst-patched path upstream deleted between the bases would make
        # `git apply` reject the WHOLE patch (it is atomic); those paths are
        # left out of the re-application and named here — their hooks are
        # re-homed by hand and acknowledged to port:check via ALLOW.
        excl=''
        for p in $(git diff --no-renames --diff-filter=D --name-only "$old" {{.BASE}}); do
          if git diff --quiet "$old" HEAD -- "$p"; then :; else echo "upstream deleted dst-patched path $p: its hooks are NOT re-applied; re-home them by hand"; excl="$excl :!$p"; fi
        done
        git diff --binary "$old" HEAD -- . $excl | git apply --3way --index

  # The delta survived + both modes build. The three-way application can
  # resolve a hunk toward the new base without a conflict, so: (a) the path
  # set of the new delta must equal the old delta's — differences are
  # upstream deletions/renames or absorbed hooks, acknowledged by name via
  # ALLOW='path ...' (echoed, so the acknowledgement rides the port commit
  # message; an ALLOW entry that is not a difference is an error, so the
  # record cannot name a fiction), never by skipping the task; (b) for every
  # dst-patched path upstream did not touch between the bases — computed
  # with --no-renames, so a renamed file's old path counts as touched — the
  # re-applied content must be byte-identical to the old tip (old and new
  # base agree there, so any difference is a dropped or altered hook) unless
  # acknowledged by name via ALTERED='path ...' (a deliberate re-derivation
  # of a dst-only file whose hook follows a change upstream made elsewhere;
  # same echo and stale-entry refusal as ALLOW); the upstream-touched dst
  # paths are listed for hand review. The record
  # written by `port` must match MERGE_HEAD, so a hand-made merge cannot
  # reuse a stale old base. Path handling is word-split by design; `port`
  # refused any path that would break it. The builds run the repo's own
  # bin/go (RUN); the tagged build is what catches upstream signature
  # changes in dst-only files.
  port:check:
    desc: 'After resolving a port: verify the dst delta survived (path set; byte-exact where upstream is untouched) and both build modes compile'
    dir: src
    deps: [tmpdir]
    cmds:
      - |
        set -e
        cd {{.ROOT_DIR}}   # git's --name-only paths are root-relative; the pathspecs fed back must resolve against the same root
        gitdir=$(git rev-parse --git-dir); tmp={{.ROOT_DIR}}/.tmp
        new=$(git rev-parse -q --verify MERGE_HEAD) || { echo 'no port in progress (MERGE_HEAD absent)'; exit 1; }
        [ -f "$gitdir/DST_PORT" ] || { echo 'no port record: the merge was not made by task port'; exit 1; }
        read -r old rec < "$gitdir/DST_PORT"
        [ "$rec" = "$new" ] || { echo "port record is for $rec but MERGE_HEAD is $new: the merge was not made by task port"; exit 1; }
        git diff --name-only "$old" HEAD | sort > "$tmp/port-old-paths"
        git diff --cached --name-only "$new" | sort > "$tmp/port-new-paths"
        printf '%s\n' {{.ALLOW}} | sed '/^$/d' | sort > "$tmp/port-allow"
        diff "$tmp/port-old-paths" "$tmp/port-new-paths" | sed -n 's/^[<>] //p' | sort > "$tmp/port-pathdiff"
        # Same refusal as `port`, over paths introduced during conflict resolution.
        if grep -q '[][:space:]"'"'"'\\*?[]' "$tmp/port-pathdiff"; then
          echo 'a path introduced by the port contains whitespace, quotes, backslashes or glob characters; the port tooling does not quote — rename it first'; exit 1
        fi
        if comm -23 "$tmp/port-pathdiff" "$tmp/port-allow" | grep .; then
          echo 'dst delta path set changed across the port (paths above); acknowledge each by name with ALLOW="path ..." and explain it in the port commit message'
          exit 1
        fi
        if comm -13 "$tmp/port-pathdiff" "$tmp/port-allow" | grep .; then
          echo 'ALLOW names paths (above) that are not path-set differences; remove them'
          exit 1
        fi
        [ -s "$tmp/port-allow" ] && { echo 'acknowledged path-set differences (ALLOW):'; cat "$tmp/port-allow"; }
        git diff --no-renames --name-only "$old" "$new" | sort > "$tmp/port-upstream-touched"
        comm -23 "$tmp/port-old-paths" "$tmp/port-upstream-touched" > "$tmp/port-untouched"
        printf '%s\n' {{.ALTERED}} | sed '/^$/d' | sort > "$tmp/port-altered"
        : > "$tmp/port-changed"
        if [ -s "$tmp/port-untouched" ]; then
          changed=$(xargs git diff --cached --name-only HEAD -- < "$tmp/port-untouched") || { echo 'git diff over the upstream-untouched dst paths failed'; exit 1; }
          printf '%s\n' "$changed" | sed '/^$/d' | sort > "$tmp/port-changed"
        fi
        if comm -23 "$tmp/port-changed" "$tmp/port-altered" | grep .; then
          echo 'dst content changed in files upstream did not touch between the bases (paths above): a hook was dropped or altered; a deliberate re-derivation is acknowledged by name with ALTERED="path ..." and explained in the port commit message'
          exit 1
        fi
        if comm -13 "$tmp/port-changed" "$tmp/port-altered" | grep .; then
          echo 'ALTERED names paths (above) whose content did not change; remove them'
          exit 1
        fi
        [ -s "$tmp/port-altered" ] && { echo 'acknowledged re-derivations in upstream-untouched files (ALTERED):'; cat "$tmp/port-altered"; }
        echo 'dst-patched paths upstream also changed — hand-review each hook against the new base:'
        comm -12 "$tmp/port-old-paths" "$tmp/port-upstream-touched"
        # Port-audit input (releases.md step 4): a push linkname upstream adds
        # on an unfenced entry is how a bubble acquires a host read the fenced
        # trampolines never see (the go1.27 port's gettimeofday); list them.
        echo 'new //go:linkname directives upstream added over the intercepted surface (moves filtered) — audit each for an unfenced entry:'
        git diff "$old" "$new" -- src/runtime src/internal/runtime src/sync src/internal/sync src/internal/synctest src/net src/os src/syscall src/time src/crypto/rand src/crypto/internal src/testing src/internal/poll | grep -E '^[-+]//go:linkname' | sed 's#^\([-+]\)//go:linkname #\1 #' | sort -u > "$tmp/port-linknames"
        comm -23 <(grep '^+ ' "$tmp/port-linknames" | cut -c3- | sort -u) <(grep '^- ' "$tmp/port-linknames" | cut -c3- | sort -u) || true
      - task: build:both
