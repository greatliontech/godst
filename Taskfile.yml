# DST enforcing test configurations — docs/dst/design.md "Enforcing test
# configurations" is the authoritative list; this file encodes it verbatim.
#
# Two operational rules these tasks exist to enforce:
#   1. Honest exit codes: no pipelines around `go test` (a `| tail -1` reports
#      the pipe's status, not the test's — this masked real failures twice).
#      Each command's failure fails its task; the aggregate is sequential and
#      fail-fast.
#   2. After ANY cmd/compile change, run `task compiler` (or at minimum
#      `bin/go clean -cache`): this fork reports a release version string, so
#      tool IDs come from the version, not the binary hash, and a reinstalled
#      compiler does NOT invalidate cached objects.
#
# Every command runs as `GOROOT={{.ROOT_DIR}} {{.GO}} ...` (via the RUN var):
# an exported GOROOT in the developer's environment would otherwise redirect
# every leg to another toolchain's runtime — green exit codes, vacuous run.
# The shell-level assignment is deliberate: Taskfile `env:` loses to the OS
# environment by default, a shell prefix never does. (The prefix assumes a
# space-free repo path; quote RUN's expansion if that ever changes.)
version: '3'

vars:
  RUN: 'GOROOT={{.ROOT_DIR}} {{.ROOT_DIR}}/bin/go'

tasks:
  test:
    desc: The fast enforcing legs (untagged, dst, dst-race), sequential and fail-fast; test:inert-std runs separately
    cmds:
      - task: test:untagged
      - task: test:dst
      - task: test:dst-race

  test:untagged:
    desc: Untagged -short runtime — DST hooks inert; testprog stays cgo-free (deadlock crash tests live)
    dir: src
    cmds:
      - '{{.RUN}} test -count=1 -short runtime'

  test:dst:
    desc: -tags dst, non-short — explore sweep, race oracle, auto-instrumentation, build-mode inertness, net shims
    dir: src
    cmds:
      - '{{.RUN}} test -tags dst -count=1 -timeout 60m runtime testing/simulation net'

  test:dst-race:
    desc: -tags dst -race testing/simulation — suite is race-clean; any TSan report here is a real finding
    dir: src
    cmds:
      - '{{.RUN}} test -tags dst -race -count=1 testing/simulation'

  test:inert-std:
    desc: Untagged -short std — build-mode inertness across all of std (heavy; not in `task test`)
    dir: src
    cmds:
      - '{{.RUN}} test -count=1 -short std'

  compiler:
    desc: Reinstall cmd/compile, then clean the build cache (release version string ⇒ stale tool IDs otherwise)
    dir: src
    cmds:
      - '{{.RUN}} install cmd/compile'
      - '{{.RUN}} clean -cache'
