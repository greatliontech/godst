# Release on a goX.Y.Z-dst.N tag — docs/dst/releases.md "Cutting a release",
# "Continuous integration", "Distribution". Enforces the gate (annotated tag,
# VERSION equals the tag, the counter is unused elsewhere, the release commit
# changes only VERSION, the release commit's parent has a green `matrix`
# run), builds each published platform natively with upstream's own
# packaging (make.bash -distpack), validates the EXTRACTED binary tarball
# (untagged version/build/test use plus the tagged smoke — the artifact
# consumers download, not the checkout), and publishes the assets.
name: release

on:
  push:
    tags: ['go*-dst.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Rehearsal: an existing go*-dst.* tag — runs the gate and the builds, publishes nothing'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Release gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          tag=$TAG
          # actions/checkout writes refs/tags/<tag> as the peeled commit; fetch
          # the real tag object from origin before judging its type.
          git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
          [ "$(git cat-file -t "$tag")" = tag ] || { echo "$tag is not an annotated tag"; exit 1; }
          ver=$(head -1 VERSION)
          [ "$ver" = "$tag" ] || { echo "VERSION is '$ver', tag is '$tag'"; exit 1; }
          n=${tag##*-dst.}
          case "$n" in ''|*[!0-9]*) echo "tag '$tag' has no numeric -dst.N counter"; exit 1;; esac
          for t in $(git tag -l '*-dst.*'); do
            [ "$t" = "$tag" ] && continue
            [ "${t##*-dst.}" = "$n" ] && { echo "counter dst.$n is already used by tag $t"; exit 1; }
          done
          changed=$(git diff --name-only "${tag}^1" "${tag}^{commit}")
          [ "$changed" = VERSION ] || { printf 'release commit must change only VERSION; it changes:\n%s\n' "$changed"; exit 1; }
          parent=$(git rev-parse "${tag}^1")
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/matrix.yml/runs?head_sha=${parent}&status=success&per_page=1" --jq '.total_count')
          [ "${runs:-0}" -ge 1 ] || { echo "no successful matrix run for the release commit's parent ${parent}"; exit 1; }
          # Stale-base refusal (releases.md, Patch cadence): a line never
          # cuts a release on a base whose upstream minor has a newer point
          # release. Fails CLOSED — see the script.
          .github/scripts/stale-base.sh "${tag%-dst.*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    name: linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/build-toolchain
        with:
          distpack: 'true'
      # Validation runs against the EXTRACTED binary tarball — the artifact
      # consumers download — not the checkout it was packed from: a distpack
      # packaging omission is invisible to any checkout-based check. The
      # extraction step itself asserts the published asset name.
      - name: Extract the binary distribution
        run: |
          set -eu
          ls -l pkg/distpack
          task dist:extract "TARBALL=pkg/distpack/${{ needs.verify.outputs.tag }}.linux-${{ matrix.goarch }}.tar.gz" "DEST=$RUNNER_TEMP/distcheck"
          echo "DIST_GOROOT=$RUNNER_TEMP/distcheck/go" >> "$GITHUB_ENV"
      - name: Extracted distribution reports the tag, builds, and tests untagged
        run: task verify:dist
        env:
          DIST_VERSION: ${{ needs.verify.outputs.tag }}
      - name: Extracted distribution tagged smoke
        run: task smoke:dist
      - name: Extracted distribution installs (versioned prefix, pinned launcher, reinstall)
        run: |
          set -eu
          t="pkg/distpack/${{ needs.verify.outputs.tag }}.linux-${{ matrix.goarch }}.tar.gz"
          task install "PREFIX=$RUNNER_TEMP/installcheck" "TARBALL=$t"
          v=$("$RUNNER_TEMP/installcheck/bin/go" version | awk '{print $3}')
          [ "$v" = "${{ needs.verify.outputs.tag }}" ] || { echo "launcher reports $v"; exit 1; }
          task install "PREFIX=$RUNNER_TEMP/installcheck" "TARBALL=$t"
          [ "$(readlink "$RUNNER_TEMP/installcheck/godst/current")" = "$RUNNER_TEMP/installcheck/godst/${{ needs.verify.outputs.tag }}" ] || { echo "current does not point at the installed version after reinstall"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: distpack-linux-${{ matrix.goarch }}
          path: pkg/distpack/*
          if-no-files-found: error
          overwrite: true

  publish:
    # A rehearsal (workflow_dispatch on an existing tag) stops here.
    if: github.event_name == 'push'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble assets
        run: |
          set -eu
          mkdir -p assets
          # Every platform's distpack emits the source tarball; they must agree, and one is published.
          for f in dist/distpack-linux-amd64/*.src.tar.gz; do cmp "$f" "dist/distpack-linux-arm64/$(basename "$f")"; done
          cp dist/distpack-linux-amd64/* assets/
          for f in dist/distpack-linux-arm64/*; do case "$f" in *.src.tar.gz) ;; *) cp "$f" assets/;; esac; done
          cd assets && sha256sum * > SHA256SUMS && ls -l
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=${{ needs.verify.outputs.tag }}
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes "godst toolchain $tag. Extract a binary tarball to go/ and run go/bin/go with GOTOOLCHAIN=local and -tags dst; see docs/dst/releases.md." \
            assets/*
