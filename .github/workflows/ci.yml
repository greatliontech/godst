# Pull-request smoke gate — docs/dst/releases.md "Continuous integration".
# Not the release gate: that is the `matrix` workflow.
name: ci

on:
  pull_request:
  push:
    branches: [main, 'release-go1.*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Budget rule: green wall time plus the largest `go test` per-package
    # timeout (60m, in test:cmd; concurrent hangs expire together) must fit,
    # so a hung test binary reaches `go test`'s own timeout and dies with a
    # goroutine dump instead of a bare job cancellation.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Tree carries no build artifact
        run: .github/scripts/no-artifacts.sh
      - uses: ./.github/actions/build-toolchain
      - name: Both build modes
        run: GOTOOLCHAIN=local task build:both
      - name: Untagged, cross-build, and api legs
        run: GOTOOLCHAIN=local task test:untagged test:cross test:api
      - name: cmd and breadth legs
        run: GOTOOLCHAIN=local task test:testdir test:cmd test:inert-std
      - name: Upstream base toolchain for the differential gate
        id: base
        run: |
          echo "version=$(head -1 VERSION | sed 's/-dst\..*//' | sed 's/^go//')" >> "$GITHUB_OUTPUT"
          # A freshly ported tree's VERSION names a base whose tag reaches
          # origin only at the port's final push — fall back to upstream.
          base=$(head -1 VERSION | sed 's/-dst\..*//')
          git fetch --depth=1 origin tag "$base" || git fetch --depth=1 https://github.com/golang/go tag "$base"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.base.outputs.version }}
          cache: false
      - name: Differential untagged text-identity gate
        run: GOTOOLCHAIN=local task test:inert-diff
        env:
          DST_REQUIRE_LIVE_DELTA: "1"
